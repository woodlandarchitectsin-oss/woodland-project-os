<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>
/* On-screen error reporter: any JavaScript error shows in red instead of a silent blank page. Must stay the first script. */
(function(){
  function show(msg){
    try{
      var b=document.getElementById("errbar");
      if(!b){b=document.createElement("div");b.id="errbar";b.setAttribute("role","alert");
        b.style.cssText="position:fixed;left:0;right:0;top:0;z-index:99999;background:#b3261e;color:#fff;padding:10px 14px;font:13px/1.4 system-ui,sans-serif;white-space:pre-wrap;max-height:40vh;overflow:auto";
        (document.body||document.documentElement).appendChild(b);}
      b.textContent="Something went wrong: "+msg+"\nReload the page. If it keeps happening, tell Ameen.";
    }catch(e){}
  }
  window.addEventListener("error",function(e){show((e.message||"error")+(e.filename?" ("+e.filename.split("/").pop()+":"+e.lineno+")":""));});
  window.addEventListener("unhandledrejection",function(e){var r=e.reason;show("Unhandled: "+(r&&r.message?r.message:String(r)));});
})();
</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2c5a47">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Woodland Project OS</title>
<link rel="manifest" href="manifest.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>

    <div class="brand"><b>WOODLAND</b><span>Project OS</span></div>
